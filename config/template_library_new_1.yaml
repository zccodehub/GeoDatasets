    - 如果你到{landmark}路口，{dir_text}那个拐角有{target}。
    - 在{landmark}路口，{dir_text}角能找到一家{target_type}。
    - 其实在{landmark}路口，{dir_text}方向有一个{target_type}。
    - 到{landmark}路口，大概{dir_text}角落有家{target_type}。
    - 你走到{landmark}路口，在{dir_text}角落能看到一家{target_type}。
