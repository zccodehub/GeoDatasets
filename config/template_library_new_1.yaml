version: '2.0'
description: 混合使用目标名称和目标类型的逻辑骨架模板库，所有模板均包含参照点信息
families:
  SCENE-B_Opposite:
    description: 马路对面参照（强依赖 road_name）
    valid_slots:
    - landmark
    - target
    - target_type
    - road
    - dir_text
    core_required:
    - landmark
    - road
    templates:
    - 穿过{road}，{target}就在对面，{landmark}的{dir_text}侧。
    - 在{road}路南侧，与{landmark}隔路相望的就是{target}。
    - 从{landmark}出发，需横穿{road}，{target}位于路对面{dir_text}。
    - 过{road}到马路对面，{landmark}斜{dir_text}有一家{target_type}。
    - 在{road}对面，{landmark}的{dir_text}方向有{target_type}。
    - 穿过{road}，{landmark}正对面有一处{target_type}。
    - 穿过{road}，你就能看到{target}在{landmark}的{dir_text}那头。
    - 如果你从{landmark}的{dir_text}走，横穿{road}就是{target}了。
    - '{target}就在{landmark}的{dir_text}对面，隔着{road}。'
    - 顺着{landmark}的{dir_text}方向，一过{road}就是{target}。
    - 把{landmark}当参照，穿过{road}去{dir_text}，目标就在正对面。
    - 其实，{landmark}的{dir_text}隔着一条{road}，过去就是{target}。
    - 你知道吗？在{landmark}的{dir_text}，穿过{road}就是{target}了。
    - 只要横穿{road}，在{landmark}的{dir_text}那边会看到{target}。
    - 要是从{landmark}出发，穿过{road}，目标就在对面{dir_text}方向。
    - 把{landmark}作为起点，过了{road}，{target}就在那边{dir_text}。
    - 其实只要离开{landmark}，穿过{road}，对面{dir_text}就是{target}。
    - 如果你站在{landmark}，需要横穿{road}去{dir_text}，目的地就在那头。
    - 顺着{landmark}的{dir_text}方向走，横穿{road}就能到{target}了。
    - 你知道怎么去吗？从{landmark}出发，过了{road}，{target}就在对面{dir_text}。
    - 出门从{landmark}走，穿过{road}，目标就在对面{dir_text}。
    - 在{road}另一侧，沿着{landmark}的{dir_text}方向，有个{target_type}。
    - 如果你看向{road}对面，{landmark}的{dir_text}方向能找到{target_type}。
    - 其实，顺着{landmark}的{dir_text}方向，到{road}对面就是{target_type}。
    - 就在{road}对面，{landmark}的{dir_text}那边有{target_type}。
    - 想找{target_type}吗？就在{landmark}的{dir_text}方向，隔着{road}对面。
    - '{road}对面，如果你看{landmark}的{dir_text}，那儿有个{target_type}。'
    - 你往{landmark}的{dir_text}看，隔着{road}对面就是{target_type}。
    - 顺着{landmark}的{dir_text}方向穿过{road}，对面就有{target_type}。
    - 穿过{road}，正对着{landmark}就是一个{target_type}。
    - 如果你在{road}这边，穿过去，正好对着{landmark}就能看到{target_type}。
    - 其实只要过了{road}，就在{landmark}正对面有{target_type}。
    - 把{road}穿过去，{landmark}正对面那里有一处{target_type}。
    - 你知道吗？穿过{road}，对着{landmark}就是{target_type}。
    - 顺着{landmark}正对面方向，穿过{road}就能到{target_type}。
    - 在{road}对面，正对着{landmark}就是{target_type}。
    - 过了{road}，对着{landmark}的位置能看见{target_type}。
  SCENE-B_SameSide:
    description: 道路同侧参照
    valid_slots:
    - landmark
    - target
    - target_type
    - road
    - dir_text
    core_required:
