    - dir_text
    templates:
    - 沿着{road}走，{target}和{landmark}在同一边，位于{landmark}的{dir_text}侧。
    - 不用过马路，{target}就在{road}同侧，挨着{landmark}往{dir_text}走。
    - '{road}路{dir_text}，{landmark}旁边就是{target}。'
    - 沿{road}同侧，{landmark}往{dir_text}不远处有一家{target_type}。
    - 在{road}同侧，{landmark}的{dir_text}方向有{target_type}。
    - 无需过马路，{landmark}同侧{dir_text}可见{target_type}。
    - 顺着{road}走，{target}就在{landmark}的{dir_text}，和{landmark}同侧。
    - 沿着{road}，{landmark}的{dir_text}方向，你能找到{target}，俩都是一边的。
    - 其实{target}就在{landmark}的{dir_text}，沿{road}看，两者都在一侧。
    - 沿着{road}，你会发现{target}和{landmark}都在同边，{target}位于{landmark}的{dir_text}。
    - 你沿{road}走，注意看{landmark}的{dir_text}，那里就是{target}，两者同侧。
    - '{target}就在{landmark}的{dir_text}，沿{road}走也不用换边。'
    - 在{road}的{dir_text}，{target}就在{landmark}旁边。
    - 顺着{road}往{dir_text}走，看到{landmark}，旁边就是{target}。
    - 你知道吗？在{road}{dir_text}方向，{landmark}旁边就是{target}。
    - '{road}{dir_text}走，紧挨着{landmark}的就是{target}。'
    - 沿着{road}往{dir_text}，{landmark}附近就是{target}。
    - 你只要在{road}的{dir_text}方向，{target}就在{landmark}旁边。
    - 走{road}，到{dir_text}这边，看见{landmark}，旁边就是{target}。
    - 沿着{road}同侧走，{landmark}往{dir_text}一点儿就有一家{target_type}。
    - 不用换边，沿{road}，在{landmark}的{dir_text}方向不远处有{target_type}。
    - 顺着{road}，跟着{landmark}往{dir_text}走，很快就能看到一家{target_type}。
    - 沿{road}，{landmark}的{dir_text}附近就有一家{target_type}。
    - 其实沿着{road}，在{landmark}往{dir_text}的位置有一家{target_type}。
    - 顺着{road}的同侧，靠近{landmark}的{dir_text}点儿就能找到{target_type}。
    - 不用过马路，{landmark}同侧{dir_text}就能看到{target_type}。
    - 你只要在{landmark}这侧，往{dir_text}看，就能找到{target_type}。
    - 其实在{landmark}同侧，朝{dir_text}方向就能见着{target_type}。
    - 不用过马路，顺着{landmark}同侧，{dir_text}方向就有{target_type}。
    - 在{landmark}这边，{dir_text}方向就能看到{target_type}。
    - 走在和{landmark}同侧，往{dir_text}一看就有{target_type}。
    - 你在{landmark}同侧，朝{dir_text}走，很快会看到{target_type}。
    - 不用换边，{landmark}同侧{dir_text}的位置就有{target_type}。
