version: "3.0"
description: 多句式混合逻辑骨架模板库 — 纯参照型、类型占位型、完整型混合，覆盖邻接、道路参照、纯方位、重合四大场景

families:
  # ==================== SCENE-B_Opposite ====================
  SCENE-B_Opposite:
    description: "马路对面参照（强依赖 road_name）"
    valid_slots:
      - landmark
      - target
      - target_type
      - road
      - dir_text
    core_required:
      - landmark
      - road
    templates:
      # 完整型（含目标名称）
      - "穿过{road}，{target}就在对面，紧挨着{landmark}的{dir_text}侧。"
      - "在{road}路对面，与{landmark}隔路相望的正是{target}。"
      # 类型占位型（含目标类型）
      - "过{road}到对面，{landmark}的{dir_text}方向有一家{target_type}。"
      - "在{road}斜对面，{landmark}的{dir_text}那边开着{target_type}。"
      # 纯参照型（不出现目标名称）
      - "到了{landmark}，过马路往{dir_text}瞧，对面就是您要找的地儿。"
      - "您呐，从{landmark}穿过{road}，正对着{dir_text}那头便是。"

  # ==================== SCENE-B_SameSide ====================
  SCENE-B_SameSide:
    description: "道路同侧参照"
    valid_slots:
      - landmark
      - target
      - target_type
      - road
      - dir_text
    core_required:
      - landmark
      - dir_text
    templates:
      # 完整型
      - "沿着{road}走，{target}和{landmark}在同一侧，就在{landmark}往{dir_text}一点。"
      - "不用换边，顺着{road}，挨着{landmark}的{dir_text}侧就能看见{target}。"
      # 类型占位型
      - "在{road}同侧，{landmark}的{dir_text}方向有一家{target_type}，不用过马路。"
      - "顺着{road}走，{landmark}的{dir_text}侧开着{target_type}。"
      # 纯参照型
      - "您到了{landmark}，沿着{road}同侧往{dir_text}走几步就到了。"
      - "从{landmark}出发，不必穿马路，顺着{road}往{dir_text}方向找。"

  # ==================== SCENE-B_Intersection ====================
  SCENE-B_Intersection:
    description: "交叉口/路口参照"
    valid_slots:
      - landmark
      - target
      - target_type
      - road
      - dir_text
    core_required:
      - landmark
      - dir_text
    templates:
      # 完整型
      - "在{road}与{landmark}交会的路口，{target}就在{dir_text}那个角。"
      - "走到{landmark}路口，往{dir_text}一拐弯就是{target}。"
      # 类型占位型
      - "到了{landmark}那个十字路口，{dir_text}角上有一家{target_type}。"
      - "在{road}和{landmark}交叉口，{dir_text}方向有{target_type}。"
      # 纯参照型
      - "您到{landmark}路口，瞧一眼{dir_text}那边的拐角，就能找到。"
      - "顺着{road}走到{landmark}，拐向{dir_text}就是目的地附近。"

  # ==================== SCENE-A ====================
  SCENE-A:
    description: "显式邻接（Abutting）"
    valid_slots:
      - landmark
      - target
      - target_type
    core_required:
      - landmark
    templates:
      # 完整型
      - "{target}紧挨着{landmark}，几乎贴在一块儿。"
      - "从{landmark}出来，隔壁就是{target}，走两步就到。"
      # 类型占位型
      - "{landmark}旁边紧挨着一家{target_type}，一墙之隔。"
      - "紧邻{landmark}的是一处{target_type}。"
      # 纯参照型
      - "到了{landmark}，旁边就是咱们要找的地方。"
      - "您瞧见{landmark}，挨着它的那个就是。"

  # ==================== SCENE-D ====================
  SCENE-D:
    description: "重合/包含（Coincident）"
    valid_slots:
      - landmark
      - target
      - target_type
    core_required:
      - landmark
    templates:
      # 完整型
      - "{target}就在{landmark}里面，实际上是同一处地方。"
      - "{target}与{landmark}位置完全重合。"
      # 类型占位型
      - "{landmark}这个位置，其实就是{target_type}的所在地。"
      - "您要找的{target_type}，就在{landmark}那栋楼里。"
      # 纯参照型
      - "到了{landmark}，目的地就在这儿，不用再挪步了。"
      - "您到了{landmark}，站的地方就是目的地。"

  # ==================== SCENE-C ====================
  SCENE-C:
    description: "纯方位+距离导向（Isolated/Detour）"
    valid_slots:
      - landmark
      - target
      - target_type
      - dir_text
      - dist_text
    core_required:
      - landmark
      - dir_text
      - dist_text
    templates:
      # 完整型（目标名称）
      - "{target}在{landmark}的{dir_text}方向，大约{dist_text}远。"
      - "从{landmark}往{dir_text}走，{dist_text}左右就能看到{target}。"
      - "您顺着{landmark}的{dir_text}方向，走个{dist_text}，就是{target}了。"
      # 类型占位型
      - "在{landmark}的{dir_text}方向，约{dist_text}处有家{target_type}。"
      - "从{landmark}往{dir_text}走{dist_text}左右，会碰到一家{target_type}。"
      - "离{landmark}大约{dist_text}，{dir_text}那边就是{target_type}。"
      # 纯参照型（无目标名称，无目标类型）
      - "您呐，从{landmark}往{dir_text}走上{dist_text}，就差不多了。"
      - "到了{landmark}，朝{dir_text}走大约{dist_text}，目的地就在附近。"
      - "顺着{landmark}的{dir_text}方向走{dist_text}，您的目标就在前头。"
      # 额外：存现句
      - "其实从{landmark}往{dir_text}走{dist_text}，您要找的就在那一片。"

  # ==================== FALLBACK_GENERIC ====================
  FALLBACK_GENERIC:
    description: "终极保底句式"
    valid_slots:
      - landmark
      - target
      - target_type
    core_required:
      - landmark
    templates:
      # 完整型
      - "{target}位于{landmark}附近。"
      - "您要找的{target}就在{landmark}周边。"
      # 类型占位型
      - "{landmark}附近有一家{target_type}。"
      - "在{landmark}周边能找到{target_type}。"
      # 纯参照型
      - "到了{landmark}，附近就是您要找的地方。"
      - "从{landmark}开始找，那地儿就在周围一带。"